name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint ──────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  # ── Security ──────────────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

  # ── Tests + coverage ─────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: urbantrack
          POSTGRES_PASSWORD: ci_test
          POSTGRES_DB: urbantrack_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urbantrack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: urbantrack.settings
      DATABASE_URL: postgres://urbantrack:ci_test@localhost:5432/urbantrack_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff coverage

      - name: Django system checks
        run: python manage.py check

      - name: Detect missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: |
          coverage run --source='.' manage.py test -v 1
          coverage report --fail-under=80
          coverage xml -o coverage.xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── Template validation ──────────────────────────────────────────
  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate all templates render without errors
        run: python manage.py test accounts.tests.test_auth.ExpertDashboardTests accounts.tests.test_auth.CompanyDashboardTests -v 2
