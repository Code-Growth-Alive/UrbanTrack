name: Deploy

on:
  push:
    branches: [main]
    types: [synchronize]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  # ── Staging (auto on push to main) ───────────────────────────────
  deploy-staging:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.urbantrack.app
    steps:
      - uses: actions/checkout@v7

      - name: Run migrations
        run: echo "Run python manage.py migrate --settings=urbantrack.settings.staging"

      - name: Collect static files
        run: echo "Run python manage.py collectstatic --noinput"

      - name: Deploy to staging
        run: echo "Deploy step — configure for your platform"

  # ── Production (manual trigger only) ─────────────────────────────
  deploy-production:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://urbantrack.app
    steps:
      - uses: actions/checkout@v7

      - name: Run migrations
        run: echo "Run python manage.py migrate --settings=urbantrack.settings.production"

      - name: Collect static files
        run: echo "Run python manage.py collectstatic --noinput"

      - name: Deploy to production
        run: echo "Deploy step — configure for your platform"

  # ── Post-deploy smoke test ───────────────────────────────────────
  smoke-test:
    needs: [deploy-staging, deploy-production]
    if: always() && (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Health check
        run: |
          URL="${{ github.event.inputs.environment == 'production' && 'https://urbantrack.app' || 'https://staging.urbantrack.app' }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/")
          if [ "$STATUS" -ne 200 ]; then
            echo "Health check failed: got $STATUS from $URL"
            exit 1
          fi
          echo "Health check passed: $STATUS from $URL"
