name: Deploy UrbanTrack to VPS

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test UrbanTrack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check migrations
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: |
          python manage.py migrate --noinput

      - name: Collect static files
        run: |
          python manage.py collectstatic --noinput

      - name: Verify Tailwind static file
        run: |
          test -f staticfiles/staticfiles.json
          python manage.py findstatic vendor/tailwind.js --verbosity 2

      - name: Run tests with coverage
        run: |
          coverage run --source='.' manage.py test -v 1
          coverage report

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/github_deploy
          chmod 600 ~/.ssh/github_deploy

          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh \
            -i ~/.ssh/github_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "echo 'SSH connection successful'"

      - name: Deploy UrbanTrack
        run: |
          ssh \
            -i ~/.ssh/github_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'

          set -e

          cd /home/ubuntu/UrbanTrack

          echo "==> Updating source code"
          git fetch origin main
          git reset --hard origin/main

          echo "==> Activating virtual environment"
          source .venv/bin/activate

          echo "==> Installing dependencies"
          pip install -r requirements.txt

          echo "==> Running migrations"
          python manage.py migrate --noinput

          echo "==> Collecting static files"
          python manage.py collectstatic --noinput

          echo "==> Restarting UrbanTrack"
          sudo systemctl restart UrbanTrack.service

          echo "==> Checking UrbanTrack status"
          sudo systemctl is-active --quiet UrbanTrack.service

          echo "==> Deployment successful"

          EOF