name: Deploy UrbanTrack to VPS

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test UrbanTrack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt coverage

      - name: Check migrations
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: |
          python manage.py migrate --noinput

      - name: Collect static files
        run: |
          python manage.py collectstatic --noinput

      - name: Verify Tailwind static file
        run: |
          test -f staticfiles/staticfiles.json
          python manage.py findstatic vendor/tailwind.js --verbosity 2

      - name: Run tests with coverage
        run: |
          coverage run --source='.' manage.py test -v 1
          coverage report

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: test
    environment: github_depoy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/github_deploy
          chmod 600 ~/.ssh/github_deploy

          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Show deployment key fingerprint
        run: |
          ssh-keygen -lf ~/.ssh/github_deploy

      - name: Show public key to authorize on the VPS
        run: |
          echo "==> Paste this line into VPS ~/.ssh/authorized_keys =="
          ssh-keygen -y -f ~/.ssh/github_deploy

      - name: Test SSH connection
        run: |
          ssh \
            -i ~/.ssh/github_deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "echo 'SSH connection successful'"

      - name: Deploy UrbanTrack
        run: |
          ssh \
            -i ~/.ssh/github_deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'

          set -e

          cd /home/ubuntu/UrbanTrack

          echo "==> Updating source code"
          git fetch origin main
          git reset --hard origin/main

          echo "==> Ensuring a working virtual environment"
          if [ ! -x .venv/bin/pip ]; then
            echo "==> .venv is missing pip; recreating it"
            sudo chown -R "$(whoami)":"$(whoami)" .venv 2>/dev/null || true
            rm -rf .venv
            if ! python3 -m venv .venv; then
              echo "==> python3-venv not installed; installing it"
              sudo apt-get update -qq
              sudo apt-get install -y -qq python3.12-venv
              rm -rf .venv
              python3 -m venv .venv
            fi
          fi

          echo "==> Ensuring PDF system libraries"
          sudo dpkg -s libpango-1.0-0 >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
              libgdk-pixbuf-2.0-0 shared-mime-info
          }

          echo "==> Activating virtual environment"
          source .venv/bin/activate

          echo "==> Installing dependencies"
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          echo "==> Running migrations"
          python manage.py migrate --noinput

          echo "==> Collecting static files"
          python manage.py collectstatic --noinput

          echo "==> Restarting UrbanTrack"
          sudo systemctl restart UrbanTrack.service

          echo "==> Checking UrbanTrack status"
          sudo systemctl is-active --quiet UrbanTrack.service

          echo "==> Deployment successful"

          EOF