{% extends "accounts/_auth_base.html" %}

{% block title %}Password reset: Urban Track{% endblock %}

{% block auth_form %}
<div class="card p-8">
  <h1 class="text-2xl font-black tracking-tight text-charcoal-900">Password reset</h1>
  <p class="mt-2 text-sm leading-relaxed text-charcoal-700">
    Your password has been set. You can now log in with your new credentials.
  </p>
  <div class="mt-6 border-t border-charcoal-900/10 pt-5 text-center">
    <a href="{% url 'accounts:login' %}" class="btn-primary w-full py-2.5 text-center">Log in</a>
  </div>
</div>
{% endblock %}
