{% extends "accounts/_auth_base.html" %}

{% block title %}Mot de passe réinitialisé : Urban Track{% endblock %}

{% block auth_form %}
<div class="card p-8">
  <h1 class="text-2xl font-black tracking-tight text-charcoal-900">Mot de passe réinitialisé</h1>
  <p class="mt-2 text-sm leading-relaxed text-charcoal-700">
    Votre mot de passe a été défini. Vous pouvez maintenant vous connecter avec
    vos nouvelles identifiants.
  </p>
  <div class="mt-6 border-t border-charcoal-900/10 pt-5 text-center">
    <a href="{% url 'accounts:login' %}" class="btn-primary w-full py-2.5 text-center">Se connecter</a>
  </div>
</div>
{% endblock %}
