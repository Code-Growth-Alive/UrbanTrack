{% extends "emails/base_email.html" %}
{% block body %}
  <p>Bonjour {{ first }},</p>
  <p>Votre candidature à <strong>« {{ title }} »</strong> ({{ org }}) a bien été envoyée.</p>
  <p>Suivez son statut depuis votre tableau de bord Urban Track.</p>
{% endblock %}
{% block actions %}
  <tr>
    <td align="center" style="padding:8px 32px 8px 32px;">
      <a href="{{ my_applications_url }}"
         style="display:inline-block; background-color:#5c6b2f; color:#ffffff;
                text-decoration:none; font-size:15px; font-weight:bold;
                padding:13px 28px; border-radius:8px;">
        Suivre mes candidatures
      </a>
    </td>
  </tr>
{% endblock %}
